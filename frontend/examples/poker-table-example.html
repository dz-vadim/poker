<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Table UI - Tailwind Example</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes flip {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(180deg); }
    }
    .card-flip:hover {
      animation: flip 0.6s ease-in-out;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-green-800 via-green-900 to-black min-h-screen flex items-center justify-center p-8">

  <div class="relative w-full max-w-5xl">

    <!-- Poker Table -->
    <div class="relative bg-gradient-to-br from-green-700 to-green-900 rounded-full border-8 border-amber-900 shadow-2xl" style="aspect-ratio: 16/10; padding: 3rem;">

      <!-- Table Center (Community Cards Area) -->
      <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex gap-2">
        <div class="w-16 h-24 bg-white rounded-lg shadow-lg border-2 border-gray-300 flex items-center justify-center text-4xl card-flip">
          A♠
        </div>
        <div class="w-16 h-24 bg-white rounded-lg shadow-lg border-2 border-gray-300 flex items-center justify-center text-4xl card-flip">
          K♥
        </div>
        <div class="w-16 h-24 bg-white rounded-lg shadow-lg border-2 border-gray-300 flex items-center justify-center text-4xl card-flip">
          Q♦
        </div>
        <div class="w-16 h-24 bg-gray-400 rounded-lg shadow-lg border-2 border-gray-500"></div>
        <div class="w-16 h-24 bg-gray-400 rounded-lg shadow-lg border-2 border-gray-500"></div>
      </div>

      <!-- Pot Amount -->
      <div class="absolute top-1/3 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
        <div class="bg-black/50 backdrop-blur-sm px-6 py-2 rounded-full border-2 border-yellow-500">
          <p class="text-yellow-400 font-bold text-xl">Pot: $450</p>
        </div>
      </div>

      <!-- Player 1 (Bottom - You) -->
      <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 translate-y-1/2">
        <div class="bg-gray-800 rounded-xl p-4 shadow-xl border-4 border-blue-500 min-w-[200px]">
          <div class="flex items-center gap-3 mb-2">
            <div class="w-12 h-12 bg-gradient-to-br from-blue-400 to-blue-600 rounded-full flex items-center justify-center text-white font-bold text-lg">
              You
            </div>
            <div>
              <p class="text-white font-semibold">Player 1</p>
              <p class="text-green-400 text-sm font-bold">$1,250</p>
            </div>
          </div>
          <div class="flex gap-2 justify-center">
            <div class="w-14 h-20 bg-white rounded-lg shadow-lg border-2 border-gray-300 flex items-center justify-center text-3xl">
              A♣
            </div>
            <div class="w-14 h-20 bg-white rounded-lg shadow-lg border-2 border-gray-300 flex items-center justify-center text-3xl">
              K♠
            </div>
          </div>
        </div>
      </div>

      <!-- Player 2 (Top Left) -->
      <div class="absolute top-4 left-8">
        <div class="bg-gray-800 rounded-xl p-3 shadow-xl border-2 border-gray-600">
          <div class="flex items-center gap-2 mb-2">
            <div class="w-10 h-10 bg-gradient-to-br from-purple-400 to-purple-600 rounded-full flex items-center justify-center text-white font-bold">
              P2
            </div>
            <div>
              <p class="text-white text-sm font-semibold">Player 2</p>
              <p class="text-green-400 text-xs font-bold">$890</p>
            </div>
          </div>
          <div class="flex gap-1">
            <div class="w-10 h-14 bg-red-600 rounded border-2 border-red-800"></div>
            <div class="w-10 h-14 bg-red-600 rounded border-2 border-red-800"></div>
          </div>
        </div>
      </div>

      <!-- Player 3 (Top Right) -->
      <div class="absolute top-4 right-8">
        <div class="bg-gray-800 rounded-xl p-3 shadow-xl border-2 border-gray-600">
          <div class="flex items-center gap-2 mb-2">
            <div class="w-10 h-10 bg-gradient-to-br from-orange-400 to-orange-600 rounded-full flex items-center justify-center text-white font-bold">
              P3
            </div>
            <div>
              <p class="text-white text-sm font-semibold">Player 3</p>
              <p class="text-green-400 text-xs font-bold">$1,450</p>
            </div>
          </div>
          <div class="flex gap-1">
            <div class="w-10 h-14 bg-red-600 rounded border-2 border-red-800"></div>
            <div class="w-10 h-14 bg-red-600 rounded border-2 border-red-800"></div>
          </div>
        </div>
      </div>

      <!-- Player 4 (Right) -->
      <div class="absolute top-1/2 right-0 transform translate-x-1/2 -translate-y-1/2">
        <div class="bg-gray-800 rounded-xl p-3 shadow-xl border-2 border-gray-600">
          <div class="flex items-center gap-2 mb-2">
            <div class="w-10 h-10 bg-gradient-to-br from-pink-400 to-pink-600 rounded-full flex items-center justify-center text-white font-bold">
              P4
            </div>
            <div>
              <p class="text-white text-sm font-semibold">Player 4</p>
              <p class="text-green-400 text-xs font-bold">$720</p>
            </div>
          </div>
          <div class="flex gap-1">
            <div class="w-10 h-14 bg-red-600 rounded border-2 border-red-800"></div>
            <div class="w-10 h-14 bg-red-600 rounded border-2 border-red-800"></div>
          </div>
        </div>
      </div>

      <!-- Player 5 (Left) -->
      <div class="absolute top-1/2 left-0 transform -translate-x-1/2 -translate-y-1/2">
        <div class="bg-gray-800 rounded-xl p-3 shadow-xl border-2 border-gray-600">
          <div class="flex items-center gap-2 mb-2">
            <div class="w-10 h-10 bg-gradient-to-br from-teal-400 to-teal-600 rounded-full flex items-center justify-center text-white font-bold">
              P5
            </div>
            <div>
              <p class="text-white text-sm font-semibold">Player 5</p>
              <p class="text-green-400 text-xs font-bold">$980</p>
            </div>
          </div>
          <div class="flex gap-1">
            <div class="w-10 h-14 bg-red-600 rounded border-2 border-red-800"></div>
            <div class="w-10 h-14 bg-red-600 rounded border-2 border-red-800"></div>
          </div>
        </div>
      </div>

      <!-- Chips (decorative) -->
      <div class="absolute bottom-1/3 left-1/3 flex -space-x-2">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-red-500 to-red-700 border-2 border-white shadow-lg"></div>
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-blue-700 border-2 border-white shadow-lg"></div>
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-green-500 to-green-700 border-2 border-white shadow-lg"></div>
      </div>

    </div>

    <!-- Action Buttons (Bottom) -->
    <div class="mt-8 flex justify-center gap-4">
      <button class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transform hover:scale-105 transition-all duration-200">
        Fold
      </button>
      <button class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transform hover:scale-105 transition-all duration-200">
        Check
      </button>
      <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transform hover:scale-105 transition-all duration-200">
        Call $50
      </button>
      <button class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transform hover:scale-105 transition-all duration-200">
        Raise
      </button>
    </div>

    <!-- Raise Slider (Example) -->
    <div class="mt-4 max-w-md mx-auto bg-gray-800 p-4 rounded-lg">
      <label class="text-white font-semibold mb-2 block">Raise Amount:</label>
      <input type="range" min="50" max="500" value="150" class="w-full h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer">
      <div class="flex justify-between text-white text-sm mt-2">
        <span>$50</span>
        <span class="font-bold text-yellow-400">$150</span>
        <span>$500</span>
      </div>
    </div>

  </div>

</body>
</html>
